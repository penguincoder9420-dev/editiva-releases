<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>EDITIVA Cámara</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #preview {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000;
      transform: scaleX(-1); /* Default selfie mirror */
      transition: transform 0.2s ease;
    }

    .topbar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: env(safe-area-inset-top, 16px) 16px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800; font-size: 15px;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      background: rgba(15,23,42,0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #eab308; }
    .dot.live { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .dot.err { background: #ef4444; }

    .stats-card {
      position: absolute; top: 72px; left: 16px; right: 16px;
      padding: 10px 14px; border-radius: 12px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 12px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
    }

    .bottombar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 16px 16px env(safe-area-inset-bottom, 24px);
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      display: flex; justify-content: center; gap: 12px;
      z-index: 10;
    }
    .btn-action {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 24px; border-radius: 999px;
      background: rgba(255,255,255,0.2); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .btn-action.primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-color: #a5b4fc;
    }
    .btn-action:active { transform: scale(0.95); }

    .overlay-msg {
      position: absolute; inset: 0; z-index: 20;
      background: rgba(9,13,22,0.97);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .overlay-msg h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #fff; }
    .overlay-msg p { font-size: 14px; opacity: 0.85; max-width: 320px; line-height: 1.5; margin-bottom: 22px; color: #cbd5e1; }
    .btn-start {
      padding: 14px 32px; border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; font-size: 15px; font-weight: 700;
      border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(79,70,229,0.4);
    }
  </style>
</head>
<body>
  <video id="preview" autoplay muted playsinline></video>

  <div class="topbar">
    <div class="brand">
      <span>🟣 EDITIVA</span>
    </div>
    <div class="status-badge" id="badge">
      <div class="dot" id="dot"></div>
      <span id="badge-text">Iniciando...</span>
    </div>
  </div>

  <div class="stats-card">
    <div>Cámara: <strong id="stat-cam-name" style="color:#38bdf8;">Frontal (Selfie)</strong></div>
    <div style="color:#22c55e; font-weight:700;">📱 DIRECTA 1080p</div>
  </div>

  <div class="bottombar">
    <button class="btn-action primary" id="btn-switch-cam">
      <span id="cam-icon" style="font-size:18px;">📷</span>
      <span id="cam-label">Cambiar a Trasera</span>
    </button>
  </div>

  <div class="overlay-msg" id="overlay" style="display:none;">
    <h2 id="overlay-title">Conectar cámara a EDITIVA</h2>
    <p id="overlay-desc">Tocá el botón para iniciar la transmisión directa a tu computadora.</p>
    <button class="btn-start" id="btn-start">Iniciar Cámara</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    const videoEl = document.getElementById('preview');
    const badgeText = document.getElementById('badge-text');
    const dotEl = document.getElementById('dot');
    const statCamName = document.getElementById('stat-cam-name');
    const btnSwitchCam = document.getElementById('btn-switch-cam');
    const camIcon = document.getElementById('cam-icon');
    const camLabel = document.getElementById('cam-label');
    const overlay = document.getElementById('overlay');
    const btnStart = document.getElementById('btn-start');

    let currentFacing = 'user'; // 'user' (frontal) | 'environment' (trasera)
    let currentStream = null;
    let peer = null;
    let activeCall = null;
    let isCalling = false;

    // Keep screen awake without heavy APIs
    function keepAwake() {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    }

    async function getCameraStream(facing) {
      const candidates = [
        {
          video: {
            facingMode: facing,
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 30, min: 24 }
          },
          audio: false
        },
        {
          video: { facingMode: facing },
          audio: false
        },
        {
          video: true,
          audio: false
        }
      ];

      for (const c of candidates) {
        try {
          const s = await navigator.mediaDevices.getUserMedia(c);
          if (s) return s;
        } catch (e) {
          console.warn('Candidate failed:', e);
        }
      }
      return null;
    }

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      const stream = await getCameraStream(currentFacing);
      if (!stream) {
        overlay.style.display = 'flex';
        return;
      }

      currentStream = stream;
      videoEl.srcObject = stream;

      const isFront = currentFacing === 'user';
      videoEl.style.transform = isFront ? 'scaleX(-1)' : 'none';
      camIcon.textContent = isFront ? '📷' : '🤳';
      camLabel.textContent = isFront ? 'Cambiar a Trasera' : 'Cambiar a Frontal';
      statCamName.textContent = isFront ? 'Frontal (Selfie)' : 'Trasera (Principal)';

      keepAwake();

      // If already connected, replace track directly without disconnecting
      if (activeCall && activeCall.peerConnection) {
        const newTrack = stream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && newTrack) {
          sender.replaceTrack(newTrack).catch(console.error);
        }
      } else {
        triggerCall();
      }
    }

    function initPeer() {
      if (!roomId) {
        overlay.style.display = 'flex';
        document.getElementById('overlay-title').textContent = 'Falta código de sala';
        document.getElementById('overlay-desc').textContent = 'Escaneá el código QR directamente desde EDITIVA en tu computadora.';
        btnStart.style.display = 'none';
        return;
      }

      badgeText.textContent = 'Conectando con PC...';
      dotEl.className = 'dot';

      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' }
          ],
          sdpSemantics: 'unified-plan',
        }
      });

      peer.on('open', () => {
        console.log('Peer listo:', peer.id);
        triggerCall();
      });

      peer.on('disconnected', () => {
        if (!peer.destroyed) peer.reconnect();
      });

      peer.on('error', (err) => {
        console.warn('Peer error:', err);
        if (!activeCall) {
          dotEl.className = 'dot err';
          badgeText.textContent = 'Reintentando...';
          setTimeout(triggerCall, 2000);
        }
      });
    }

    function triggerCall() {
      if (!peer || !peer.open || !roomId || !currentStream || isCalling) return;
      if (activeCall && (activeCall.open || (activeCall.peerConnection && activeCall.peerConnection.iceConnectionState === 'connected'))) {
        return;
      }

      isCalling = true;
      badgeText.textContent = 'Conectando...';
      dotEl.className = 'dot';

      try {
        // Send hardware camera stream DIRECTLY with zero CPU/GPU overhead
        const call = peer.call(roomId, currentStream);
        activeCall = call;

        const pc = call.peerConnection;
        if (pc) {
          pc.addEventListener('connectionstatechange', () => {
            if (pc.connectionState === 'connected') {
              dotEl.className = 'dot live';
              badgeText.textContent = 'En vivo en EDITIVA';
              isCalling = false;
            } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
              dotEl.className = 'dot err';
              badgeText.textContent = 'Reconectando...';
              isCalling = false;
              activeCall = null;
              setTimeout(triggerCall, 2000);
            }
          });
        }

        call.on('close', () => {
          isCalling = false;
          activeCall = null;
          setTimeout(triggerCall, 2000);
        });

        call.on('error', () => {
          isCalling = false;
          activeCall = null;
          setTimeout(triggerCall, 2000);
        });
      } catch (err) {
        isCalling = false;
        setTimeout(triggerCall, 2500);
      }
    }

    btnSwitchCam.addEventListener('click', async () => {
      btnSwitchCam.style.opacity = '0.5';
      currentFacing = currentFacing === 'user' ? 'environment' : 'user';
      await startCamera();
      btnSwitchCam.style.opacity = '1';
    });

    btnStart.addEventListener('click', () => {
      overlay.style.display = 'none';
      startCamera();
    });

    // Auto recover on tab focus
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        keepAwake();
        if (!currentStream || !currentStream.active) startCamera();
        if (!activeCall || !activeCall.open) triggerCall();
      }
    });

    startCamera().then(initPeer);
  </script>
</body>
</html>
