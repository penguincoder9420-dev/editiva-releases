<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>EDITIVA Cámara 60 FPS</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #preview {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000;
      transform: scaleX(1); /* Trasera sin espejo */
      z-index: 1;
    }

    .topbar {
      position: absolute; top: 0; left: 0; right: 0;
      padding: env(safe-area-inset-top, 16px) 16px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800; font-size: 15px;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      background: rgba(15,23,42,0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #eab308; }
    .dot.live { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .dot.err { background: #ef4444; }

    .bottombar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 16px 16px env(safe-area-inset-bottom, 24px);
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      display: flex; justify-content: center; gap: 12px;
      z-index: 10;
    }
    .btn-action {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 28px; border-radius: 999px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: 1px solid #a5b4fc;
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .btn-action:active { transform: scale(0.95); }

    .overlay-msg {
      position: absolute; inset: 0; z-index: 20;
      background: #090d16;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .overlay-msg h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #fff; }
    .overlay-msg p { font-size: 15px; opacity: 0.85; max-width: 320px; line-height: 1.5; margin-bottom: 28px; color: #cbd5e1; }
    .btn-start {
      padding: 16px 36px; border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; font-size: 16px; font-weight: 700;
      border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(79,70,229,0.5);
    }
    .btn-start:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <video id="preview" autoplay muted playsinline webkit-playsinline></video>

  <div class="topbar">
    <div class="brand">
      <span>🟣 EDITIVA</span>
    </div>
    <div class="status-badge" id="badge">
      <div class="dot" id="dot"></div>
      <span id="badge-text">Iniciando...</span>
    </div>
  </div>

  <div class="bottombar">
    <button class="btn-action" id="btn-switch-cam">
      <span id="cam-icon" style="font-size:18px;">🤳</span>
      <span id="cam-label">Cambiar a Frontal</span>
    </button>
  </div>

  <div class="overlay-msg" id="overlay">
    <h2>EDITIVA Cámara</h2>
    <p>Tocá el botón abajo para activar la cámara trasera en hasta 60 FPS.</p>
    <button class="btn-start" id="btn-start">▶ Iniciar Cámara Trasera</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    const videoEl = document.getElementById('preview');
    videoEl.muted = true;
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('webkit-playsinline', '');

    const badgeText = document.getElementById('badge-text');
    const dotEl = document.getElementById('dot');
    const btnSwitchCam = document.getElementById('btn-switch-cam');
    const camIcon = document.getElementById('cam-icon');
    const camLabel = document.getElementById('cam-label');
    const overlay = document.getElementById('overlay');
    const btnStart = document.getElementById('btn-start');

    // Default to rear camera with up to 60 FPS
    let currentFacing = 'environment';
    let currentStream = null;
    let peer = null;
    let activeCall = null;
    let isCalling = false;

    function keepAwake() {
      try {
        if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
      } catch {}
    }

    async function getCameraStream(facing) {
      // Prioritize 60 FPS on Samsung Camera2 sensor
      const candidates = [
        {
          video: {
            facingMode: { ideal: facing },
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 },
            frameRate: { ideal: 60, min: 30 }
          },
          audio: false
        },
        {
          video: {
            facingMode: { ideal: facing },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 60 }
          },
          audio: false
        },
        {
          video: {
            facingMode: { ideal: facing },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 60 }
          },
          audio: false
        },
        {
          video: { facingMode: facing, frameRate: { ideal: 60 } },
          audio: false
        },
        {
          video: true,
          audio: false
        }
      ];

      for (const c of candidates) {
        try {
          const s = await navigator.mediaDevices.getUserMedia(c);
          if (s) return s;
        } catch (e) {
          console.warn('Candidate failed:', e);
        }
      }
      return null;
    }

    async function apply60FpsEncodings(call) {
      if (!call || !call.peerConnection) return;
      try {
        const senders = call.peerConnection.getSenders();
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender) {
          const params = videoSender.getParameters();
          if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];
          params.encodings[0].maxBitrate = 12000000;      // 12 Mbps for crystal clarity
          params.encodings[0].maxFramerate = 60;          // Allow full 60 FPS
          params.encodings[0].degradationPreference = 'maintain-framerate';
          await videoSender.setParameters(params);
          console.log('[EDITIVA] Encodings configurados: 60 FPS max, 12 Mbps');
        }
      } catch (err) {
        console.warn('Error setting 60fps encodings:', err);
      }
    }

    async function activateCamera(facing) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      const stream = await getCameraStream(facing);
      if (!stream) {
        alert('No se pudo acceder a la cámara. Por favor asegurate de dar permisos en el navegador.');
        return false;
      }

      currentStream = stream;
      currentFacing = facing;
      videoEl.srcObject = stream;

      try {
        await videoEl.play();
      } catch (err) {
        console.warn('video.play() warning:', err);
      }

      const isFront = currentFacing === 'user';
      videoEl.style.transform = isFront ? 'scaleX(-1)' : 'scaleX(1)';
      camIcon.textContent = isFront ? '📷' : '🤳';
      camLabel.textContent = isFront ? 'Cambiar a Trasera' : 'Cambiar a Frontal';

      keepAwake();

      if (activeCall && activeCall.peerConnection) {
        const newTrack = stream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender && newTrack) {
          await sender.replaceTrack(newTrack).catch(console.error);
          apply60FpsEncodings(activeCall);
        }
      } else {
        triggerCall();
      }

      return true;
    }

    function initPeer() {
      if (!roomId) {
        badgeText.textContent = 'Falta código QR';
        dotEl.className = 'dot err';
        return;
      }

      badgeText.textContent = 'Conectando con PC...';
      dotEl.className = 'dot';

      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' }
          ]
        }
      });

      peer.on('open', () => {
        console.log('Peer en línea:', peer.id);
        triggerCall();
      });

      peer.on('disconnected', () => {
        if (!peer.destroyed) peer.reconnect();
      });

      peer.on('error', (err) => {
        console.warn('Peer error:', err);
        dotEl.className = 'dot err';
        badgeText.textContent = 'Buscando a EDITIVA en PC...';
        isCalling = false;
        activeCall = null;
        setTimeout(triggerCall, 2000);
      });
    }

    function triggerCall() {
      if (!peer || !peer.open || !roomId || !currentStream || isCalling) return;
      if (activeCall && (activeCall.open || (activeCall.peerConnection && activeCall.peerConnection.iceConnectionState === 'connected'))) {
        return;
      }

      isCalling = true;
      badgeText.textContent = 'Llamando a EDITIVA...';
      dotEl.className = 'dot';

      try {
        const call = peer.call(roomId, currentStream);
        activeCall = call;

        const pc = call.peerConnection;
        if (pc) {
          const onConnected = () => {
            if (pc.connectionState === 'connected' || pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
              dotEl.className = 'dot live';
              badgeText.textContent = 'En vivo en EDITIVA (60 FPS)';
              isCalling = false;
              apply60FpsEncodings(call);
            }
          };

          pc.addEventListener('connectionstatechange', () => {
            console.log('WebRTC state:', pc.connectionState);
            onConnected();
            if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected' || pc.connectionState === 'closed') {
              dotEl.className = 'dot err';
              badgeText.textContent = 'Reconectando con PC...';
              isCalling = false;
              activeCall = null;
              setTimeout(triggerCall, 2000);
            }
          });

          pc.addEventListener('iceconnectionstatechange', () => {
            console.log('ICE state:', pc.iceConnectionState);
            onConnected();
            if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'closed') {
              dotEl.className = 'dot err';
              badgeText.textContent = 'Reconectando con PC...';
              isCalling = false;
              activeCall = null;
              setTimeout(triggerCall, 2000);
            }
          });

          setTimeout(() => apply60FpsEncodings(call), 1000);
          setTimeout(() => apply60FpsEncodings(call), 3000);
        }

        call.on('close', () => {
          console.log('Call closed');
          dotEl.className = 'dot err';
          badgeText.textContent = 'Llamada cerrada, reintentando...';
          isCalling = false;
          activeCall = null;
          setTimeout(triggerCall, 2000);
        });

        call.on('error', (err) => {
          console.warn('Call error:', err);
          dotEl.className = 'dot err';
          badgeText.textContent = 'Reintentando llamada...';
          isCalling = false;
          activeCall = null;
          setTimeout(triggerCall, 2000);
        });
      } catch (err) {
        isCalling = false;
        setTimeout(triggerCall, 2500);
      }
    }

    btnSwitchCam.addEventListener('click', async () => {
      btnSwitchCam.style.opacity = '0.5';
      const nextFacing = currentFacing === 'user' ? 'environment' : 'user';
      await activateCamera(nextFacing);
      btnSwitchCam.style.opacity = '1';
    });

    btnStart.addEventListener('click', async () => {
      overlay.style.display = 'none';
      const ok = await activateCamera('environment');
      if (ok) initPeer();
    });

    // Auto recover on tab focus
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        keepAwake();
        if (currentStream && !currentStream.active) activateCamera(currentFacing);
        if (!activeCall || !activeCall.open) triggerCall();
      }
    });

    // Start with rear camera
    activateCamera('environment').then(ok => {
      if (ok) {
        overlay.style.display = 'none';
        initPeer();
      }
    });
  </script>
</body>
</html>
